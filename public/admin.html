<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal | UPI Gateway Central Command</title>
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/admin.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    if (window.location.hostname.endsWith('vercel.app')) {
      window.location.replace('/localhost-notice.html');
    }
  </script>
</head>
<body>

  <!-- Top Navbar with Connection Status Badge -->
  <header class="admin-header" role="banner">
    <div class="header-container">
      <div class="admin-brand">
        <span class="shield-icon">🛡️</span>
        <div class="brand-text">
          <span class="brand-title">Admin Console</span>
          <span class="brand-sub">UPI Merchant Network Switch</span>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 16px;">
        <span id="adminConnBadge" class="conn-badge offline" aria-label="Live WebSocket Status">
          <span class="dot"></span> Offline, retrying…
        </span>
        <div id="adminNavUser" class="admin-user-group hidden">
          <span class="admin-name">Logged in: <strong id="adminLoggedName">admin</strong></span>
          <button id="adminSettingsBtn" class="btn btn-outline btn-sm">⚙️ Profile</button>
          <button id="adminLogoutBtn" class="btn btn-outline btn-sm">Sign Out</button>
        </div>
      </div>
    </div>
  </header>

  <!-- DYNAMIC VIEW MOUNT CONTAINER (SHOW ONLY ONE STATE PER SCREEN) -->
  <main id="adminMainContainer" class="admin-main" role="region" aria-live="polite">
    <!-- Active screen mounted here dynamically -->
  </main>

  <!-- TEMPLATE 1: ADMIN LOGIN VIEW -->
  <template id="adminLoginTemplate">
    <div class="admin-login-wrapper">
      <div class="admin-login-card">
        <div class="login-header">
          <div class="login-icon">🔐</div>
          <h2>Administrator Sign In</h2>
          <p>Superuser access for merchant controls & platform oversight</p>
        </div>

        <form id="adminLoginForm" novalidate>
          <div class="form-group">
            <label for="adminUsername">Administrator Username</label>
            <input type="text" id="adminUsername" placeholder="Enter admin username" value="shubhg9401" autocomplete="username" required>
          </div>

          <div class="form-group">
            <label for="adminPassword">Administrator Password</label>
            <input type="password" id="adminPassword" placeholder="Enter admin password" value="admin123" autocomplete="current-password" required>
            <small class="hint">Default: <code>shubhg9401</code> or <code>admin</code> / <code>admin123</code></small>
          </div>

          <button type="submit" id="adminLoginSubmitBtn" class="btn btn-primary btn-block">Authenticate &rarr;</button>
          <div id="adminLoginAlert" class="alert hidden" role="alert"></div>
        </form>
      </div>
    </div>
  </template>

  <!-- TEMPLATE 2: ADMIN DASHBOARD VIEW -->
  <template id="adminDashboardTemplate">
    <div class="admin-dashboard-wrapper">
      <!-- STATS KPI ROW -->
      <section class="stats-kpi-grid" aria-label="Platform Statistics Overview">
        <div class="kpi-card">
          <div class="kpi-icon">💼</div>
          <div class="kpi-content">
            <span class="kpi-label">Total Merchants</span>
            <h3 id="kpiTotalMerchants">0</h3>
          </div>
        </div>

        <div class="kpi-card">
          <div class="kpi-icon green">✅</div>
          <div class="kpi-content">
            <span class="kpi-label">Active Merchants</span>
            <h3 id="kpiActiveMerchants">0</h3>
          </div>
        </div>

        <div class="kpi-card">
          <div class="kpi-icon red">🚫</div>
          <div class="kpi-content">
            <span class="kpi-label">Blocked Merchants</span>
            <h3 id="kpiBlockedMerchants">0</h3>
          </div>
        </div>

        <div class="kpi-card">
          <div class="kpi-icon blue">💰</div>
          <div class="kpi-content">
            <span class="kpi-label">Total Platform Volume</span>
            <h3 id="kpiTotalGmv">₹0.00</h3>
          </div>
        </div>
      </section>

      <!-- MERCHANT MANAGEMENT CARD -->
      <section class="admin-card" aria-label="Merchant Management">
        <div class="card-header-bar">
          <div>
            <h3>Merchant Management</h3>
            <p class="subtitle">Approve, block, or reset credentials for any registered merchant.</p>
          </div>
          <div style="display: flex; gap: 8px;">
            <button id="clearFakeDataBtn" class="btn btn-danger-outline btn-sm">🧹 Clear Fake Data</button>
            <button id="refreshMerchantsBtn" class="btn btn-outline btn-sm">↻ Refresh</button>
          </div>
        </div>

        <!-- Table Toolbar: Search, Status Filter -->
        <div class="table-toolbar">
          <input type="text" id="merchantSearchInput" class="table-search" placeholder="🔍 Search by phone, UPI ID, or 6-digit code..." aria-label="Search merchants">
          <select id="merchantStatusFilter" class="table-filter" aria-label="Filter merchants by status">
            <option value="">All Account Statuses</option>
            <option value="active">Active</option>
            <option value="blocked">Blocked</option>
          </select>
        </div>

        <div class="table-responsive">
          <table class="admin-table">
            <thead>
              <tr>
                <th scope="col">Assigned Code</th>
                <th scope="col">Merchant Phone</th>
                <th scope="col">Provider</th>
                <th scope="col">Registered UPI IDs</th>
                <th scope="col">Account Status</th>
                <th scope="col">Registered Date</th>
                <th scope="col">Governance Actions</th>
              </tr>
            </thead>
            <tbody id="merchantsTableBody">
              <!-- Rendered dynamically -->
            </tbody>
          </table>
        </div>

        <!-- Pagination Controls -->
        <div class="table-pagination">
          <button type="button" id="merchantsPrevBtn" class="pagination-btn">&larr; Previous</button>
          <span id="merchantsPageInfo" class="pagination-info">Page 1 of 1</span>
          <button type="button" id="merchantsNextBtn" class="pagination-btn">Next &rarr;</button>
        </div>
      </section>

      <!-- GLOBAL TRANSACTIONS AUDIT TABLE -->
      <section class="admin-card" aria-label="Global Transaction Audit Log">
        <div class="card-header-bar">
          <div>
            <h3>Global Transaction Audit Log</h3>
            <p class="subtitle">Live audit stream of all transactions across all merchant accounts.</p>
          </div>
          <button id="refreshTxnsBtn" class="btn btn-outline btn-sm">↻ Refresh</button>
        </div>

        <!-- Table Toolbar: Search, Status Filter -->
        <div class="table-toolbar">
          <input type="text" id="txnSearchInput" class="table-search" placeholder="🔍 Search by TXN ID, merchant code, or UPI ID..." aria-label="Search transactions">
          <select id="txnStatusFilter" class="table-filter" aria-label="Filter transactions by status">
            <option value="">All Transaction Statuses</option>
            <option value="approved">Approved</option>
            <option value="pending">Pending</option>
            <option value="denied">Denied</option>
          </select>
        </div>

        <div class="table-responsive">
          <table class="admin-table">
            <thead>
              <tr>
                <th scope="col">TXN ID</th>
                <th scope="col">Total Amount</th>
                <th scope="col">Assigned Code</th>
                <th scope="col">Split Chunks</th>
                <th scope="col">Payment Status</th>
                <th scope="col">Created Time</th>
              </tr>
            </thead>
            <tbody id="adminTxnsTableBody">
              <!-- Rendered dynamically -->
            </tbody>
          </table>
        </div>

        <!-- Pagination Controls -->
        <div class="table-pagination">
          <button type="button" id="txnsPrevBtn" class="pagination-btn">&larr; Previous</button>
          <span id="txnsPageInfo" class="pagination-info">Page 1 of 1</span>
          <button type="button" id="txnsNextBtn" class="pagination-btn">Next &rarr;</button>
        </div>
      </section>

      <!-- ADMIN CREDENTIALS & PROFILE SECTION -->
      <section class="admin-card" id="adminCredentialsInlineCard" style="margin-top: 24px;" aria-label="Admin Security Settings">
        <div class="card-header-bar">
          <div>
            <h3>Admin Security &amp; Credentials</h3>
            <p class="subtitle">Manage administrator credentials configured in the environment.</p>
          </div>
        </div>

        <div style="padding: 20px;">
          <form id="adminSettingsInlineForm" style="max-width: 520px;" novalidate>
            <div class="form-group">
              <label for="adminInlineCurrentUsername">Active Username</label>
              <input type="text" id="adminInlineCurrentUsername" disabled class="input-disabled" value="shubhg9401">
            </div>

            <div class="form-group">
              <label for="adminInlineNewPassword">New Password</label>
              <input type="password" id="adminInlineNewPassword" placeholder="Enter new password (min 4 chars)" minlength="4">
            </div>

            <div class="form-group">
              <label for="adminInlineConfirmPassword">Confirm New Password</label>
              <input type="password" id="adminInlineConfirmPassword" placeholder="Re-enter new password">
            </div>

            <button type="submit" class="btn btn-primary" style="margin-top: 6px;">Update Password</button>
            <div id="adminInlineAlert" class="alert hidden" role="alert"></div>
          </form>
        </div>
      </section>
    </div>
  </template>

  <!-- PASSWORD RESET MODAL -->
  <div id="passwordModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="resetModalTitle">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 id="resetModalTitle">Reset Merchant Password</h3>
        <button id="closeModalBtn" class="close-btn" aria-label="Close dialog">&times;</button>
      </div>
      <form id="resetPasswordForm" novalidate>
        <input type="hidden" id="resetMerchantId">
        <div class="modal-body">
          <p>Resetting password for Merchant: <strong id="resetMerchantPhone">9876543210</strong></p>
          <div class="form-group" style="margin-top: 14px;">
            <label for="newPassword">New Merchant Password</label>
            <input type="password" id="newPassword" placeholder="Enter new password (min 4 chars)" minlength="4" required>
          </div>
          <div id="resetModalAlert" class="alert hidden" role="alert"></div>
        </div>
        <div class="modal-footer">
          <button type="button" id="cancelResetBtn" class="btn btn-outline">Cancel</button>
          <button type="submit" class="btn btn-primary">Save New Password</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modular Reusable Components & Reactive State Architecture -->
  <script src="/js/shared/store.js"></script>
  <script src="/js/shared/api.js"></script>
  <script src="/js/shared/sound.js"></script>
  <script src="/js/shared/utils.js"></script>
  <script src="/js/shared/uiComponents.js"></script>
  <script src="/js/admin/adminState.js"></script>
  <script src="/js/admin/adminApp.js"></script>
</body>
</html>
