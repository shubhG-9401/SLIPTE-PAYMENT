<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UPI Instant Payment Terminal</title>
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/user.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <div class="user-terminal-container">

    <!-- TOP HEADER WITH WEBSOCKET CONNECTION BADGE -->
    <header class="terminal-header" role="banner">
      <div class="upi-logo-container">
        <span class="upi-text">UPI</span>
        <span class="unified-text">UNIFIED PAYMENTS INTERFACE</span>
      </div>
      <span id="userConnBadge" class="conn-badge offline" aria-label="Live Connection Status">
        <span class="dot"></span> Offline, retrying…
      </span>
    </header>

    <!-- DYNAMIC SINGLE VIEW MOUNT CONTAINER (ONLY ONE STATE MOUNTED AT A TIME) -->
    <div id="userTerminalApp" role="region" aria-live="polite">
      <!-- Active screen mounted here dynamically -->
    </div>

  </div>

  <!-- VIEW 1: PAIRING CODE INPUT -->
  <template id="tmplPairing">
    <div id="pairingBox" class="terminal-card pairing-card">
      <div class="card-icon">🔗</div>
      <h2>Connect to Merchant Terminal</h2>
      <p class="subtitle">Enter the merchant's 6-digit Assigned Unique Code to pair</p>

      <form id="pairingForm" novalidate>
        <div class="form-group" style="text-align: left;">
          <label for="inputPairingCode" style="font-size: 0.82rem; font-weight: 700; color: #1e3a8a; margin-bottom: 6px; display: block;">Merchant 6-Digit Code</label>
          <div class="code-input-wrapper">
            <input type="text" id="inputPairingCode" name="code" placeholder="e.g. 999999" maxlength="12" autocomplete="off" required inputmode="numeric">
          </div>
        </div>
        <button type="submit" id="connectTerminalBtn" class="btn-upi-primary">Connect Terminal &rarr;</button>
        <div id="pairingAlert" class="alert hidden" role="alert"></div>
      </form>
    </div>
  </template>

  <!-- VIEW 2: TERMINAL 3 BLOCKED / WARNING STATE -->
  <template id="tmplBlocked">
    <div id="terminalBlockedState" class="terminal-card blocked-card">
      <div class="warning-icon-badge">⚠️</div>
      <h2 class="warning-title">ACCESS BLOCKED</h2>
      <div class="warning-subtitle">Terminal 3 Limit Reached</div>
      <div class="warning-box">
        <p class="warning-main-text"><strong>Maximum 2 Terminals Allowed</strong></p>
        <p class="warning-detail-text">The merchant with code <strong id="blockedMerchantCode">------</strong> already has <strong>2 active customer terminals</strong> (Terminal 1 &amp; Terminal 2) connected.</p>
        <div class="warning-callout">
          🚫 <strong>Terminal 3 access is blocked.</strong> Merchant accounts permit a maximum of 2 concurrent paired terminals.
        </div>
      </div>
      <button type="button" id="retryPairingBtn" class="btn-upi-primary" style="margin-top: 18px;">&larr; Try Another Code</button>
    </div>
  </template>

  <!-- VIEW 3: WAITING FOR MERCHANT TO PUSH AMOUNT -->
  <template id="tmplWaiting">
    <div class="terminal-card upi-blue-box">
      <div class="upi-box-header">
        <div class="upi-brand-mark">
          <span class="upi-symbol">▲</span>
          <span class="upi-brand-name">UPI Pay</span>
        </div>
        <div class="merchant-connected-tag">
          <span class="dot live"></span>
          <span id="merchantInfoText">Merchant Connected</span>
        </div>
      </div>

      <div class="upi-state-section">
        <div class="pulse-ring">
          <div class="pulse-inner">₹</div>
        </div>
        <h3>Ready for Payment</h3>
        <p>Terminal paired with <strong id="waitingMerchantUpi">merchant@paytm</strong></p>
        <span class="waiting-subtext">Waiting for merchant to push payment request...</span>
      </div>

      <div class="upi-box-footer">
        <span class="safe-badge">🔒 256-Bit Bank-Grade UPI Security</span>
      </div>
    </div>
  </template>

  <!-- VIEW 4: ACTIVE PAYMENT WITH TIMER RING, SPLIT STEP INDICATOR & DEEP LINK -->
  <template id="tmplActivePayment">
    <div class="terminal-card upi-blue-box">
      <div class="upi-box-header">
        <div class="upi-brand-mark">
          <span class="upi-symbol">▲</span>
          <span class="upi-brand-name">UPI Pay</span>
        </div>
        <div class="merchant-connected-tag">
          <span class="dot live"></span>
          <span id="activeMerchantTag">Merchant Live</span>
        </div>
      </div>

      <div class="upi-state-section">
        <!-- Circular Countdown Timer Ring -->
        <div class="timer-ring-container" title="120-Second Payment Expiration Window">
          <svg class="timer-ring-svg" viewBox="0 0 100 100">
            <circle class="timer-ring-bg" cx="50" cy="50" r="42"></circle>
            <circle id="userTimerRingCircle" class="timer-ring-progress" cx="50" cy="50" r="42"></circle>
          </svg>
          <div class="timer-ring-center">
            <span id="userTimerDigits" class="timer-ring-digits" aria-live="polite">02:00</span>
            <span class="timer-ring-label">Time Left</span>
          </div>
        </div>

        <!-- Sequential Split Steps Indicator (e.g. Part 2 of 3) -->
        <div id="splitStepsBox" class="split-steps-wrapper hidden">
          <span id="splitStepBadge" class="split-step-badge">Part 1 of 1</span>
          <div id="splitProgressDots" class="split-progress-dots"></div>
        </div>

        <!-- Total Bill Amount -->
        <div class="amount-billboard">
          <span class="currency-symbol">₹</span>
          <span id="displayTotalAmount" class="billboard-amount">0.00</span>
          <span id="splitNoticeBadge" class="split-notice-badge hidden">Auto-Split (≤ ₹1999)</span>
        </div>

        <!-- QR Code Presentation & Beside/Mobile Quick Pay Button -->
        <div class="qr-presentation-card">
          <div id="userQrFrame" class="qr-frame">
            <img id="qrImage" src="" alt="Dynamic UPI QR Code" class="qr-code-img">
            <div id="qrLoading" class="qr-loading">Generating Dynamic QR...</div>
            <div id="qrExpiredOverlay" class="qr-expired-overlay hidden" role="alert">
              <span class="qr-expired-icon">⏱</span>
              <span class="qr-expired-title">QR CODE EXPIRED</span>
              <span class="qr-expired-desc">120s payment window elapsed</span>
            </div>
          </div>

          <div class="qr-meta">
            <span class="meta-amount" id="currentPartAmount">₹0.00</span>
            <div class="meta-upi-route" id="currentPartRoute">
              <span class="route-icon">➔</span> Paying to: <strong id="currentPartUpi">paytm.s1m66cw@pty</strong>
            </div>
            <span class="meta-desc">Scan with Paytm, GPay, PhonePe or any UPI app</span>
          </div>
        </div>
      </div>

      <div class="upi-box-footer">
        <span class="safe-badge">🔒 256-Bit Bank-Grade UPI Security</span>
      </div>
    </div>
  </template>

  <!-- VIEW 5: PAYMENT SUBMITTED / VERIFYING -->
  <template id="tmplSubmitted">
    <div class="terminal-card upi-blue-box">
      <div class="upi-state-section">
        <div class="waiting-spinner"></div>
        <h3>Payment Submitted!</h3>
        <p class="submitted-msg">Your payment confirmation has been sent to the merchant for live approval.</p>
        <div class="alert-info-box" style="margin-top: 16px;">
          Please wait while the merchant checks their Paytm app and confirms receipt.
        </div>
      </div>
      <div class="upi-box-footer">
        <span class="safe-badge">🔒 256-Bit Bank-Grade UPI Security</span>
      </div>
    </div>
  </template>

  <!-- VIEW 6: PAYMENT APPROVED CELEBRATION -->
  <template id="tmplApproved">
    <div class="terminal-card upi-blue-box">
      <div class="upi-state-section">
        <div class="success-icon-badge">✓</div>
        <h2 class="success-title">Payment Approved!</h2>
        <p class="success-subtitle">The merchant has verified and accepted your payment.</p>
        <div class="receipt-box" style="margin-top: 18px;">
          <div class="receipt-row">
            <span>Amount Paid:</span>
            <strong id="receiptAmount">₹0.00</strong>
          </div>
          <div class="receipt-row">
            <span>Status:</span>
            <span class="status-tag live">VERIFIED &amp; APPROVED</span>
          </div>
        </div>
        <button type="button" id="resetTerminalBtn" class="btn-upi-primary" style="margin-top: 20px;">Ready for Next Payment &rarr;</button>
      </div>
      <div class="upi-box-footer">
        <span class="safe-badge">🔒 256-Bit Bank-Grade UPI Security</span>
      </div>
    </div>
  </template>

  <!-- VIEW 7: PAYMENT DENIED -->
  <template id="tmplDenied">
    <div class="terminal-card upi-blue-box">
      <div class="upi-state-section">
        <div class="denied-icon-badge">✕</div>
        <h2 class="denied-title">Payment Denied</h2>
        <p class="denied-subtitle">The merchant could not verify this transaction.</p>
        <div class="alert-denied-box" style="margin-top: 18px;">
          If funds were debited from your account, they will be automatically refunded by your bank within 24-48 hours.
        </div>
        <button type="button" id="retryTerminalBtn" class="btn-upi-primary" style="margin-top: 20px;">Back to Terminal</button>
      </div>
      <div class="upi-box-footer">
        <span class="safe-badge">🔒 256-Bit Bank-Grade UPI Security</span>
      </div>
    </div>
  </template>

  <!-- VIEW 8: PAYMENT EXPIRED -->
  <template id="tmplExpired">
    <div class="terminal-card upi-blue-box">
      <div class="upi-state-section">
        <div class="expired-icon-badge">⏱</div>
        <h2 class="expired-title">Payment Request Expired</h2>
        <p class="expired-subtitle">The 2-minute payment window has elapsed.</p>
        <button type="button" id="expiredTerminalBtn" class="btn-upi-primary" style="margin-top: 20px;">Return to Terminal</button>
      </div>
      <div class="upi-box-footer">
        <span class="safe-badge">🔒 256-Bit Bank-Grade UPI Security</span>
      </div>
    </div>
  </template>

  <!-- Modular Reusable Components & Reactive State Architecture -->
  <script src="/js/shared/store.js"></script>
  <script src="/js/shared/api.js"></script>
  <script src="/js/shared/sound.js"></script>
  <script src="/js/shared/utils.js"></script>
  <script src="/js/shared/uiComponents.js"></script>
  <script src="/js/user/userState.js"></script>
  <script src="/js/user/userApp.js"></script>
</body>
</html>
